<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQLCraft Studio - Plataforma Interactiva de Práctica SQL</title>
  <meta name="description" content="Aprende y domina SQL interactivo con ejecución en tiempo real, evaluador inteligente, CodeMirror con autocompletado y banco de ejercicios completos.">
  
  <!-- Favicon SVG en Data URI (evita 404) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- CodeMirror 5 (Editor SQL Profesional) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/sql-hint.min.js"></script>

  <!-- SQL.js (SQLite WebAssembly en el Navegador) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <!-- Confetti JS para celebración -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Arquitectura Modular de Estilos CSS -->
  <link rel="stylesheet" href="css/main.css?v=11">
</head>
<body>

  <!-- Componente: Cabecera Principal -->
  <div id="header-slot"></div>

  <!-- Layout Principal de la Aplicación -->
  <div class="app-layout">
    
    <!-- Componente: Barra Lateral (Sidebar de Retos y Filtros) -->
    <div id="sidebar-slot"></div>

    <!-- Divisor Redimensionable: Barra Lateral vs Área de Trabajo -->
    <div class="resizer-col" id="resizer-sidebar" title="Arrastra para ajustar el ancho del banco de retos (Doble clic para restablecer)">
      <div class="resizer-handle"></div>
    </div>

    <!-- Área de Trabajo Central -->
    <main class="workspace-container" id="workspace-container">
      
      <!-- Panel Superior: Problema + Editor -->
      <section class="top-workspace" id="top-workspace">
        <!-- Componente: Panel de Problema / Sandbox / Examen -->
        <div id="problem-slot"></div>

        <!-- Divisor Redimensionable: Indicaciones vs Consola / Editor -->
        <div class="resizer-col" id="resizer-editor" title="Arrastra para ajustar el ancho entre las indicaciones y el editor (Doble clic para restablecer)">
          <div class="resizer-handle"></div>
        </div>

        <!-- Componente: Panel del Editor CodeMirror -->
        <div id="editor-slot"></div>
      </section>

      <!-- Divisor Redimensionable: Editor vs Consola de Resultados -->
      <div class="resizer-row" id="resizer-workspace" title="Arrastra para ajustar la altura entre el editor y la consola de resultados (Doble clic para restablecer)">
        <div class="resizer-handle"></div>
      </div>

      <!-- Componente: Panel Inferior de Consola, Resultados y Esquema -->
      <div id="results-slot"></div>

    </main>
  </div>

  <!-- Componentes Modales (Diálogos independientes) -->
  <div id="cheatsheet-modal-slot"></div>
  <div id="shortcuts-modal-slot"></div>
  <div id="confirm-solution-modal-slot"></div>
  <div id="completion-modal-slot"></div>
  <div id="auth-modal-slot"></div>
  <div id="confirm-dialog-slot"></div>

  <!-- Capa de Datos y Motor SQLite WASM -->
  <script src="js/db.js?v=12"></script>
  <script src="js/ejercicios.js?v=12"></script>
  <script src="js/exam-banks.js?v=12"></script>
  <script src="js/auth.js?v=12"></script>

  <!-- Módulos de Arquitectura de la Aplicación -->
  <script src="js/modules/components.js?v=11"></script>
  <script src="js/modules/state.js?v=11"></script>
  <script src="js/modules/ui.js?v=11"></script>
  <script src="js/modules/editor.js?v=11"></script>
  <script src="js/modules/results.js?v=11"></script>
  <script src="js/modules/practice.js?v=11"></script>
  <script src="js/modules/exam.js?v=11"></script>
  <script src="js/modules/tour.js?v=12"></script>

  <!-- Orquestador Principal de Inicialización y Eventos -->
  <script src="js/app.js?v=11"></script>
</body>
</html>
