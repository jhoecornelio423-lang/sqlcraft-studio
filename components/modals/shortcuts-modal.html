<dialog class="app-modal" id="shortcuts-modal">
    <div class="modal-card modal-card-sm">
      <div class="modal-header">
        <div class="modal-title-group">
          <span class="modal-icon">⌨️</span>
          <h3>Atajos de Teclado</h3>
        </div>
        <button class="modal-close-btn" onclick="cerrarModal('shortcuts-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="shortcut-row">
          <span class="shortcut-desc">Probar Consulta SQL</span>
          <div class="keys-capsule"><kbd>Ctrl</kbd> + <kbd>Enter</kbd></div>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-desc">Comprobar y Evaluar Ejercicio</span>
          <div class="keys-capsule"><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Enter</kbd></div>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-desc">Autocompletar SQL / Tablas</span>
          <div class="keys-capsule"><kbd>Ctrl</kbd> + <kbd>Espacio</kbd></div>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-desc">Siguiente Ejercicio</span>
          <div class="keys-capsule"><kbd>Alt</kbd> + <kbd>→</kbd></div>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-desc">Ejercicio Anterior</span>
          <div class="keys-capsule"><kbd>Alt</kbd> + <kbd>←</kbd></div>
        </div>
      </div>
    </div>
  </dialog>
